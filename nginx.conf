# ============================================================
# 织间 zhijian —— 容器内 nginx
#   /            前端静态文件（SPA，未命中的路径回 index.html）
#   /api/        PocketBase REST API（含 realtime SSE 订阅、文件上传下载）
#   /_/          PocketBase 管理后台
# 上游 PocketBase 只监听容器内 127.0.0.1:8090，不直接对外暴露。
# ============================================================

upstream pocketbase {
    server 127.0.0.1:8090;
    keepalive 15;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传限制：PocketBase 的 file 字段已放宽到 25MB，这里留余量
    client_max_body_size 40m;

    # ---- 前端路由（SPA history 模式）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- PocketBase API ----
    location /api/ {
        proxy_pass http://pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # realtime 订阅走 SSE：必须关缓冲 + 拉长超时，否则订阅会被中途掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    # ---- PocketBase 管理后台 ----
    location /_/ {
        proxy_pass http://pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
